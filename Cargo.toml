[package]
name = "atrader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "rust_decimal", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.6"
tracing = "0.1.44"
