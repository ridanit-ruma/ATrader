[package]
name = "atrader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
encoding_rs = "0.8.41"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-arbitrary-precision"] }
rust_decimal_macros = "1.40.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2.2", features = ["chrono04", "rust_decimal1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "rust_decimal", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zyris = { git = "https://github.com/attacca-cc/zyris-protocol", rev = "4614f0ea16f646408df590c0b249bd34c7a05d69", version = "0.2.0", features = ["tls-ring"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread", "macros", "sync", "time"] }
