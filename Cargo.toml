[package]
name = "atrader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "rust_decimal", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread", "macros", "sync", "time"] }
